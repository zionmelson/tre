[package]
name = "tre-arb-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Ultra-light Solana arbitrage executor focused on latency-sensitive CoreCast ingestion and Jito bundle submission."
license = "Apache-2.0"
repository = "https://github.com/ye/tre"

[dependencies]
anyhow = "1"
bytes = "1"
futures = "0.3"
once_cell = "1"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.11", default-features = false, features = ["transport", "gzip", "codegen", "prost"] }
prost = "0.12"
prost-types = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking"] }
tokio-native-tls = "0.3"
tokio-tungstenite = { version = "0.21", default-features = false, features = ["native-tls"] }
solana-sdk = { version = "1.18", features = ["program"] }
solana-client = "1.18"
bs58 = "0.5"
base64 = "0.22"
url = "2"
tower = { version = "0.4", features = ["util"] }
http = "0.2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
core_affinity = "0.8"
crossbeam-utils = "0.8"
crossbeam-queue = "0.3"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
prost-build = "0.12"
tonic-build = { version = "0.11", features = ["prost"] }

[features]
default = ["native-metrics"]
native-metrics = []

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[profile.dev]
incremental = true


